name: Verify Python Core

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Memory Guard Core Simulation
        run: python memory_guard.py

      - name: Run Agent Integration Example
        run: python agent_integration_example.py

      - name: Run Unit Tests
        run: python -m unittest discover -v
